[project]
name = "fulcrum-mcp"
version = "0.3.0"
description = "Read-only MCP server for Amazon MSK (Kafka) and AWS Glue Schema Registry, using IAM auth."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rmavuluri" }]
requires-python = ">=3.11"
keywords = ["mcp", "kafka", "msk", "aws", "glue", "schema-registry", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "mcp==2.3.0",
    "boto3==1.43.121",
    "confluent-kafka==2.16.1",
    "aws-msk-iam-sasl-signer-python==1.0.2",
    "pydantic==2.14.1",
]

[project.urls]
Homepage = "https://github.com/rmavuluri/fulcrum/tree/main/plugins/fulcrum"
Repository = "https://github.com/rmavuluri/fulcrum"
Issues = "https://github.com/rmavuluri/fulcrum/issues"
Changelog = "https://github.com/rmavuluri/fulcrum/blob/main/plugins/fulcrum/CHANGELOG.md"

[project.scripts]
fulcrum-mcp = "fulcrum_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulcrum_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/fulcrum_mcp", "README.md", "LICENSE"]
