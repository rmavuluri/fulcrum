[project]
name = "fulcrum-mcp"
version = "0.2.0"
description = "Read-only MCP server for Amazon MSK (Kafka) and AWS Glue Schema Registry, using IAM auth."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "boto3==1.43.121",
    "confluent-kafka==2.16.1",
    "aws-msk-iam-sasl-signer-python==1.0.2",
    "pydantic==2.14.1",
]

[project.scripts]
fulcrum-mcp = "fulcrum_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "moto[glue]==5.2.5",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulcrum_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLW0603", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fulcrum_mcp --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: runs against real AWS; needs FULCRUM_INTEGRATION=1 and credentials"]

[tool.coverage.run]
branch = true
omit = ["src/fulcrum_mcp/__main__.py"]
