[project]
name = "fulcrum-mcp"
version = "0.2.1"
description = "Read-only MCP server for Amazon MSK (Kafka) and AWS Glue Schema Registry, using IAM auth."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "boto3==1.43.121",
    "confluent-kafka==2.16.1",
    "aws-msk-iam-sasl-signer-python==1.0.2",
    "pydantic==2.14.1",
]

[project.scripts]
fulcrum-mcp = "fulcrum_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulcrum_mcp"]
