# Pins the published fulcrum-mcp server (see .mcp.json) and, through uv.lock, every package it
# depends on, with hashes. The server's source is in packages/fulcrum-mcp in the repository.
[project]
name = "fulcrum-plugin"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fulcrum-mcp==0.3.0"]
