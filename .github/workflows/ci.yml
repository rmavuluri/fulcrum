name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: plugins/fulcrum/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: plugins/fulcrum/server/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Ruff lint
        run: uv run --frozen ruff check src tests
      - name: Ruff format
        run: uv run --frozen ruff format --check src tests
      - name: Tests (coverage gate 80%)
        run: uv run --frozen pytest --cov-report=xml

  validate:
    name: Validate plugin & marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate --strict ./plugins/fulcrum
      - name: Validate marketplace
        run: claude plugin validate --strict .
