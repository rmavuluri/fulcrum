name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Ruff lint
        run: uv run --frozen ruff check packages tests
      - name: Ruff format
        run: uv run --frozen ruff format --check packages tests
      - name: Tests (coverage gate 80%)
        run: uv run --frozen pytest --cov-report=xml
      - name: Plugin lock is current
        run: uv lock --check --project plugins/fulcrum
      - name: Package builds and the built server starts
        shell: bash
        run: |
          uv build packages/fulcrum-mcp --out-dir dist
          uv run --frozen python tests/mcp_smoke.py uvx --from "$(ls dist/*.whl)" fulcrum-mcp
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Published server starts with the .mcp.json command
        run: uv run --frozen python tests/mcp_smoke.py
        env:
          UV_PYTHON: ${{ matrix.python }}

  validate:
    name: Validate plugin & marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin
        run: claude plugin validate --strict ./plugins/fulcrum
      - name: Directory pre-check
        run: claude plugin validate --profile directory --strict ./plugins/fulcrum
      - name: Validate marketplace
        run: claude plugin validate --strict .
