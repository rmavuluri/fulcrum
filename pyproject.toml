# Development environment for the Fulcrum plugin: tests, lint and coverage.
# The plugin's runtime project (what users install) is plugins/fulcrum/pyproject.toml.
[project]
name = "fulcrum-dev"
version = "0"
requires-python = ">=3.11"
# Same pins as plugins/fulcrum/pyproject.toml (tests/test_packaging.py keeps them in sync).
# The plugin's code is put on sys.path by pytest (see pythonpath below) rather than installed
# through a [tool.uv.sources] path entry, which the plugin directory flags as a registry redirect.
dependencies = [
    "mcp==2.3.0",
    "boto3==1.43.121",
    "confluent-kafka==2.16.1",
    "aws-msk-iam-sasl-signer-python==1.0.2",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "moto[glue]==5.2.5",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["plugins/fulcrum/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLW0603", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["fulcrum_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/fulcrum/src"]
addopts = "-q --cov=fulcrum_mcp --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: runs against real AWS; needs FULCRUM_INTEGRATION=1 and credentials"]

[tool.coverage.run]
branch = true
omit = ["*/fulcrum_mcp/__main__.py"]
